<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cash.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gtawtrfinance</title>
    <style>
      /* Panel Arka Planı */
      #rp-warning-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
      }
      /* Panelin Kendisi */
      .rp-warning-box {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 8px;
        max-width: 500px;
        width: 90%;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        font-family: Arial, sans-serif;
      }
      .rp-warning-box h2 {
        color: #d9534f;
        margin-top: 0;
        font-size: 24px;
      }
      .rp-warning-box p {
        color: #333333;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 25px;
      }
      /* Buton */
      .rp-warning-btn {
        background-color: #d9534f;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .rp-warning-btn:hover {
        background-color: #c9302c;
      }

      /* Yükleme Ekranı (Dolar İşareti) */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        z-index: 10000; /* En üstte durması için */
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
      }
      .dollar-sign {
        font-size: 150px;
        color: #2ecc71;
        font-weight: bold;
        text-shadow: 0 0 30px #2ecc71;
        animation: pulseDollar 0.8s infinite alternate;
      }
      @keyframes pulseDollar {
        0% { transform: scale(1); text-shadow: 0 0 20px #2ecc71; }
        100% { transform: scale(1.2); text-shadow: 0 0 60px #2ecc71; }
      }
    </style>
  </head>
  <body>
    <!-- Yükleme Ekranı -->
    <div id="loading-screen">
      <div class="dollar-sign">$</div>
    </div>

    <!-- Uyarı Paneli -->
    <div id="rp-warning-overlay">
      <div class="rp-warning-box">
        <img src="/gtaw-logo.png" alt="GTAW Logo" style="max-width: 150px; margin-bottom: 15px;">
        <h2>DİKKAT!</h2>
        <p>Bu site tamamen Roleplay amaçlı yapılmıştır. GTAW:TR için ROL kapsamında hazırlanmıştır. Gerçeği yansıtmıyor.</p>
        <button class="rp-warning-btn" onclick="closeWarningPanel()">Anladım</button>
      </div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- İşlevsellik için JS -->
    <script>
      // Özel İşlemlerde Çalacak Ses Fonksiyonu
      window.playClickSound = function() {
        const clickSound = new Audio('/click.wav');
        clickSound.volume = 0.5; 
        clickSound.play().catch(e => {
            console.log("Otomatik ses engellendi.");
        });
      };

      // Yükleme ekranı ve Para Sesi
      window.addEventListener('load', function() {
        window.playClickSound(); // Sayfa yenilendiğinde çalması için eklendi
        const loadingScreen = document.getElementById('loading-screen');
        const cashSound = new Audio('https://actions.google.com/sounds/v1/foley/cash_register.ogg');
        
        // Sayfa yüklendikten 1.2 saniye sonra animasyonu bitir ve sesi çal
        setTimeout(() => {
          cashSound.play().catch(e => console.log("Otomatik oynatma tarayıcı tarafından kısıtlandı."));
          
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500); // Yarım saniye fade-out (kaybolma) süresi
        }, 1200);
      });

      document.addEventListener("DOMContentLoaded", function() {
        // Her açılışta uyarı paneli görünsün
        document.getElementById('rp-warning-overlay').style.display = 'flex';
      });

      function closeWarningPanel() {
        document.getElementById('rp-warning-overlay').style.display = 'none';
        
        // İlk girişte "Anladım" butonuna tıklandığında da sesi çal (Tarayıcı kısıtlamasını aşmak için)
        const cashSound = new Audio('https://actions.google.com/sounds/v1/foley/cash_register.ogg');
        cashSound.play().catch(e => {});
      }
    </script>
  </body>
</html>
