<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cash.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gtawtrfinance</title>
    <style>
      /* Panel Arka Planı */

      /* Yükleme Ekranı (Ajans Logosu) */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 10000; /* En üstte durması için */
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
      }
      .loading-logo {
        max-width: 300px;
        filter: drop-shadow(0 10px 25px rgba(0,0,0,0.3));
        animation: pulseLogo 1s infinite alternate;
      }
      @keyframes pulseLogo {
        0% { transform: scale(1); filter: drop-shadow(0 10px 25px rgba(0,0,0,0.3)); }
        100% { transform: scale(1.05); filter: drop-shadow(0 15px 35px rgba(0,0,0,0.5)); }
      }
    </style>
  </head>
  <body>
    <!-- Yükleme Ekranı -->
    <div id="loading-screen">
      <img src="/voxverse.png" alt="Voxverse Logo" class="loading-logo" />
    </div>

    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- İşlevsellik için JS -->
    <script>
      // Özel İşlemlerde Çalacak Ses Fonksiyonu
      window.playClickSound = function() {
        const clickSound = new Audio('/click.wav');
        clickSound.volume = 0.5; 
        clickSound.play().catch(e => {
            console.log("Otomatik ses engellendi.");
        });
      };

      // Yükleme ekranı ve Para Sesi
      window.addEventListener('load', function() {
        window.playClickSound(); // Sayfa yenilendiğinde çalması için eklendi
        const loadingScreen = document.getElementById('loading-screen');
        
        // Sayfa yüklendikten 1.2 saniye sonra animasyonu bitir ve sesi çal
        setTimeout(() => {
          
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500); // Yarım saniye fade-out (kaybolma) süresi
        }, 1200);
      });
    </script>
  </body>
</html>
